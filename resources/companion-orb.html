<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blablabla Orb</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: no-drag;
      }
      .orb {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #d8e4ff 0%, #7f8ef7 24%, #131a2d 58%, #01050c 100%);
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.08),
          0 0 20px rgba(122,150,255,0.35),
          0 0 32px rgba(77,208,255,0.24);
        position: relative;
        animation: pulse 2.4s ease-in-out infinite;
        transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
        cursor: grab;
      }
      .orb:hover {
        transform: translateY(-1px) scale(1.03);
        filter: brightness(1.08);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 0 28px rgba(122,150,255,0.42), 0 0 40px rgba(77,208,255,0.28);
      }
      .orb:active {
        cursor: grabbing;
        transform: scale(0.98);
      }
      .orb::before {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.18);
        background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.18), rgba(255,255,255,0.04));
      }
      .orb::after {
        content: "";
        position: absolute;
        inset: 24px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.12);
        background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.44), rgba(255,255,255,0.02));
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: .9; }
        50% { transform: scale(1.08); opacity: 1; }
        100% { transform: scale(1); opacity: .9; }
      }
    </style>
  </head>
  <body>
    <div class="orb" aria-label="Blablabla orb" title="Drag me"></div>
    <script>
      const orb = document.querySelector('.orb');
      let dragging = false;
      let dragStart = null;
      let moveStart = null;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(value, max));
      }

      function getBounds() {
        return new Promise((resolve) => {
          if (window.electronAPI && typeof window.electronAPI.getOrbBounds === 'function') {
            window.electronAPI.getOrbBounds().then((bounds) => resolve(bounds || { x: 0, y: 0 })).catch(() => resolve({ x: 0, y: 0 }));
            return;
          }
          resolve({ x: 0, y: 0 });
        });
      }

      orb.addEventListener('pointerdown', async (event) => {
        dragging = true;
        const bounds = await getBounds();
        dragStart = { x: event.clientX, y: event.clientY };
        moveStart = { x: bounds.x || 0, y: bounds.y || 0 };
        orb.setPointerCapture?.(event.pointerId);
      });

      orb.addEventListener('pointermove', (event) => {
        if (!dragging || !dragStart || !moveStart) return;

        const dx = event.clientX - dragStart.x;
        const dy = event.clientY - dragStart.y;
        const nextX = moveStart.x + dx;
        const nextY = moveStart.y + dy;

        const display = window.screen?.availableWidth ? {
          width: window.screen.availWidth,
          height: window.screen.availHeight,
        } : { width: 1600, height: 900 };

        const clampedX = clamp(nextX, 0, Math.max(0, display.width - 160));
        const clampedY = clamp(nextY, 0, Math.max(0, display.height - 160));

        if (window.electronAPI && typeof window.electronAPI.moveOrbTo === 'function') {
          window.electronAPI.moveOrbTo(clampedX, clampedY);
        }
      });

      const endDrag = () => {
        dragging = false;
        dragStart = null;
        moveStart = null;
      };

      orb.addEventListener('pointerup', endDrag);
      orb.addEventListener('pointerleave', endDrag);
      orb.addEventListener('pointercancel', endDrag);
      document.addEventListener('pointerup', endDrag);
    </script>
  </body>
</html>
